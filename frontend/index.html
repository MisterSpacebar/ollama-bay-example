<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ollama Data Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; font-size: 0.85rem; }
  th, td { border: 1px solid #ccc; padding: 2px 8px; }
  th { background: #f3f3f3; position: sticky; top: 0; }
  #preview { max-height: 300px; overflow: auto; margin: 1rem 0; }
  #answer { white-space: pre-wrap; background: #f8f8f8; padding: 1rem; min-height: 4rem; margin-top: 1rem; }
  input[type=text] { width: 70%; }
  .muted { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Ollama Data Chat</h1>

<h2>Load from server data</h2>
<select id="localGroups"></select>
<button id="loadLocal">Load selected</button>
<button id="loadAll">Load ALL (ask about everything)</button>
<p class="muted">"Load ALL" loads every folder under water_data/ at once so you can ask
broad questions spanning the whole corpus; tools reference datasets by name.</p>

<h2>Or upload a file</h2>
<input type="file" id="file" accept=".csv,.xlsx,.xlsm,.json">
<button id="upload">Upload</button>
<span id="status"></span>

<div>
  <label><input type="checkbox" id="clean"> Quarantine out-of-range sensor values</label>
</div>

<div id="preview"></div>
<div id="cleaningReport"></div>
<div id="fcmSummary"></div>

<form id="chat" hidden>
  <input type="text" id="question" placeholder="Ask about your data..." required>
  <button>Ask</button>
</form>
<div id="answer"></div>

<script>
let datasetId = null;
let datasetGroupId = null;
const $ = (id) => document.getElementById(id);

async function loadLocalGroups() {
  const res = await fetch("/api/local-datasets");
  if (!res.ok) return;
  const { groups } = await res.json();
  const select = $("localGroups");
  select.innerHTML = "";
  groups.forEach((g) => {
    const opt = document.createElement("option");
    opt.value = g.path;
    opt.textContent = `${g.path} (${g.files.length} file${g.files.length === 1 ? "" : "s"})`;
    select.appendChild(opt);
  });
}
loadLocalGroups();

function activateSingleDataset(data) {
  datasetId = data.dataset_id;
  datasetGroupId = null;
  $("status").textContent = `${data.filename}: ${data.rows} rows`;
  renderTable(data.columns.map((c) => c.name), data.preview);
  renderCleaningReport(data.cleaning_report);
  renderFcmSummary(data.fcm_summary);
  $("chat").hidden = false;
}

$("loadLocal").onclick = async () => {
  const path = $("localGroups").value;
  if (!path) return;
  $("status").textContent = "Loading...";
  const res = await fetch("/api/local-datasets/load", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path, clean: $("clean").checked }),
  });
  if (!res.ok) {
    $("status").textContent = (await res.json()).detail;
    return;
  }
  activateSingleDataset(await res.json());
};

$("loadAll").onclick = async () => {
  $("status").textContent = "Loading all datasets...";
  const res = await fetch("/api/local-datasets/load-all", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ clean: $("clean").checked }),
  });
  if (!res.ok) {
    $("status").textContent = (await res.json()).detail;
    return;
  }
  const data = await res.json();
  datasetGroupId = data.dataset_group_id;
  datasetId = null;
  $("status").textContent = `Loaded ${data.datasets.length} datasets`;
  $("preview").innerHTML = data.datasets
    .map((d) => `<div><strong>${d.name}</strong> — ${d.rows} rows — ${d.columns.join(", ")}</div>`)
    .join("");
  $("cleaningReport").textContent = "";
  $("fcmSummary").textContent = "";
  $("chat").hidden = false;
};

$("upload").onclick = async () => {
  const f = $("file").files[0];
  if (!f) return;
  $("status").textContent = "Uploading...";
  const body = new FormData();
  body.append("file", f);
  body.append("clean", $("clean").checked);
  const res = await fetch("/api/upload", { method: "POST", body });
  if (!res.ok) {
    $("status").textContent = (await res.json()).detail;
    return;
  }
  activateSingleDataset(await res.json());
};

function renderCleaningReport(report) {
  const div = $("cleaningReport");
  if (!report || !report.length) { div.textContent = ""; return; }
  const lines = report.map((r) => `${r.column}: quarantined ${r.quarantined} (bounds ${r.bounds[0]}–${r.bounds[1]})`);
  div.innerHTML = `<strong>Cleaning report</strong><pre>${lines.join("\n")}</pre>`;
}

function renderFcmSummary(summary) {
  const div = $("fcmSummary");
  if (!summary || !summary.top_causal_edges || !summary.top_causal_edges.length) { div.textContent = ""; return; }
  const lines = summary.top_causal_edges
    .slice(0, 8)
    .map((e) => `${e.from} ${e.weight > 0 ? "promotes" : "suppresses"} ${e.to} (${e.weight > 0 ? "+" : ""}${e.weight})`);
  div.innerHTML = `<strong>Precomputed causal relationships (FCM)</strong><pre>${lines.join("\n")}</pre>`;
}

function renderTable(cols, rows) {
  const table = document.createElement("table");
  const head = table.insertRow();
  cols.forEach((c) => { const th = document.createElement("th"); th.textContent = c; head.appendChild(th); });
  rows.forEach((r) => {
    const tr = table.insertRow();
    cols.forEach((c) => { tr.insertCell().textContent = r[c] ?? ""; });
  });
  $("preview").replaceChildren(table);
}

$("chat").onsubmit = async (e) => {
  e.preventDefault();
  const out = $("answer");
  out.textContent = "";
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      dataset_id: datasetId,
      dataset_group_id: datasetGroupId,
      question: $("question").value,
    }),
  });
  if (!res.ok) { out.textContent = (await res.json()).detail; return; }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split("\n\n");
    buffer = events.pop();
    for (const ev of events) {
      const payload = ev.replace(/^data: /, "");
      if (payload === "[DONE]") return;
      const msg = JSON.parse(payload);
      if (msg.tool) out.textContent += `[tool] ${msg.tool}\n`;
      else out.textContent += msg.token ?? `\n[error: ${msg.error}]`;
    }
  }
};
</script>
</body>
</html>
